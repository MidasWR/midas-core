apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.SysInfoService.DNS }}
  labels:
    app: {{ .Values.SysInfoService.DNS }}
spec:
  replicas: {{ .Values.SysInfoService.DeploymentReplicas }}
  selector:
    matchLabels:
      app: {{ .Values.SysInfoService.DNS }}
  template:
    metadata:
      labels:
        app: {{ .Values.SysInfoService.DNS }}
    spec:
      serviceAccountName: sysinfo-sa
      containers:
        - name: si
          image: "{{ .Values.SysInfoService.Image }}:{{.Values.Tag}}"
          imagePullPolicy: {{ .Values.Policy.ImagePullPolicy }}
          ports:
            - containerPort: {{ .Values.SysInfoService.RestPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: {{.Values.All.targetPort}}
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            tcpSocket:
              port: {{.Values.All.targetPort}}
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: {{.Values.All.targetPort}}
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 2
      restartPolicy: {{ .Values.Policy.RestartPolicy }}
      securityContext:
        runAsNonRoot: false
