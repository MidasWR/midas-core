apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.SettingService.DNS}}
  namespace: {{ .Values.TLS.Cert.Namespace }}
  labels:
    app: {{.Values.SettingService.DNS}}
spec:
  replicas: {{ .Values.SettingService.DeploymentReplicas }}
  selector:
    matchLabels:
      app: {{.Values.SettingService.DNS}}
  template:
    metadata:
      labels:
        app: {{.Values.SettingService.DNS}}
    spec:
      serviceAccountName: setting-service-sa
      containers:
        - name: setting-service
          image: "{{ .Values.SettingService.Image }}:{{ .Values.Tag }}"
          imagePullPolicy: {{ .Values.Policy.ImagePullPolicy }}
          ports:
            - containerPort: {{ .Values.SettingService.RestPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: {{.Values.All.targetPort}}
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            tcpSocket:
              port: {{.Values.All.targetPort}}
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: {{.Values.All.targetPort}}
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 2

      restartPolicy: {{ .Values.Policy.RestartPolicy }}
      securityContext:
        runAsNonRoot: false
