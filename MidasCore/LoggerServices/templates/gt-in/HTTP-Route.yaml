---
# Primary HTTPRoute: nip.io / custom domain (DNS-dependent)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.Gateway.DNS }}-http
  namespace: midas
spec:
  parentRefs:
    - name: {{.Values.Gateway.DNS}}-gateway
      sectionName: http
  hostnames:
    - "{{.Values.ExternalIP}}.nip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ .Values.Gateway.DNS }}
          port: {{ .Values.Gateway.RestPort }}
    - matches:
        - path:
            type: Exact
            value: /mcp
      backendRefs:
        - name: {{ .Values.Gateway.DNS }}
          port: {{ .Values.Gateway.RestPort }}
    - matches:
        - path:
            type: Exact
            value: /help
      backendRefs:
        - name: {{ .Values.Gateway.DNS }}
          port: {{ .Values.Gateway.RestPort }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.Frontend.DNS }}
          port: {{ .Values.Frontend.RestPort }}
---
# Fallback HTTPRoute: direct IP / NodePort (VPN-safe, no hostname restriction).
# Attached to the http-direct listener which accepts any Host header.
# Omitting hostnames here means this route matches ALL incoming hostnames
# on the http-direct listener — including raw IP access and custom domains.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.Gateway.DNS }}-http-direct
  namespace: midas
spec:
  parentRefs:
    - name: {{.Values.Gateway.DNS}}-gateway
      sectionName: http-direct
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ .Values.Gateway.DNS }}
          port: {{ .Values.Gateway.RestPort }}
    - matches:
        - path:
            type: Exact
            value: /mcp
      backendRefs:
        - name: {{ .Values.Gateway.DNS }}
          port: {{ .Values.Gateway.RestPort }}
    - matches:
        - path:
            type: Exact
            value: /help
      backendRefs:
        - name: {{ .Values.Gateway.DNS }}
          port: {{ .Values.Gateway.RestPort }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.Frontend.DNS }}
          port: {{ .Values.Frontend.RestPort }}