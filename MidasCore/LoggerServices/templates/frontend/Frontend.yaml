apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.Frontend.DNS}}
  labels:
    app: {{.Values.Frontend.DNS}}
spec:
  replicas: {{.Values.EventService.DeploymentReplicas}}
  selector:
    matchLabels:
      app: {{.Values.Frontend.DNS}}
  template:
    metadata:
      labels:
        app: {{.Values.Frontend.DNS}}
    spec:
      containers:
        - name: front-service
          image: "{{.Values.Frontend.Image}}:{{.Values.Tag}}"
          imagePullPolicy: {{.Values.Policy.ImagePullPolicy}}
          ports:
            - containerPort: {{.Values.Frontend.RestPort}}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: {{.Values.Frontend.RestPort}}
            failureThreshold: 20
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: {{.Values.Frontend.RestPort}}
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: {{.Values.Frontend.RestPort}}
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 2
      restartPolicy: {{.Values.Policy.RestartPolicy}}
      securityContext:
        runAsNonRoot: false