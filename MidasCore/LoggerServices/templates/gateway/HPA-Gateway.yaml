apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{.Values.Gateway.DNS}}-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{.Values.Gateway.DNS}}
  minReplicas: {{.Values.Gateway.MinReplicas}}
  maxReplicas: {{.Values.Gateway.MaxReplicas}}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{.Values.Gateway.CpuAverage}}
  behavior:
    scaleUp:
      # React to load spikes immediately: allow doubling replicas every 15s.
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      # Wait 5 minutes before scaling down to avoid thrashing after a traffic burst.
      # Scale down at most 1 pod per minute to minimize impact.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
