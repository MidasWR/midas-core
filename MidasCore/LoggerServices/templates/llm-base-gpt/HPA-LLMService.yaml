apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{.Values.LLMBaseGPTService.DNS}}-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{.Values.LLMBaseGPTService.DNS}}
  minReplicas: {{.Values.LLMBaseGPTService.MinReplicas}}
  maxReplicas: {{.Values.LLMBaseGPTService.MaxReplicas}}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{.Values.LLMBaseGPTService.CpuAverage}}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      # LLM service is expensive to scale up — keep replicas alive for 10 min after load drops.
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
