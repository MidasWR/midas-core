apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.LLMBaseGPTService.DNS}}
  labels:
    app: {{.Values.LLMBaseGPTService.DNS}}
spec:
  replicas: {{.Values.Gateway.DeploymentReplicas}}
  selector:
    matchLabels:
      app: {{.Values.LLMBaseGPTService.DNS}}
  template:
    metadata:
      labels:
        app: {{.Values.LLMBaseGPTService.DNS}}
    spec:
      containers:
        - name: gateway
          image:  "{{.Values.LLMBaseGPTService.Image}}:{{.Values.Tag}}"
          imagePullPolicy: {{.Values.Policy.ImagePullPolicy}}
          ports:
            - containerPort: {{.Values.LLMBaseGPTService.RestPort}}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: {{.Values.All.targetPort}}
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            tcpSocket:
              port: {{.Values.All.targetPort}}
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: {{.Values.All.targetPort}}
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 2
      restartPolicy: {{.Values.Policy.RestartPolicy}}
      securityContext:
        runAsNonRoot: false


