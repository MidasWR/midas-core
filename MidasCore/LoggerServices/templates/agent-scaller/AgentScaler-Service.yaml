apiVersion: v1
kind: Service
metadata:
  name: {{.Values.AgentScalerService.DNS}}
spec:
  selector:
    app: {{.Values.AgentScalerService.DNS}}
  ports:
    - protocol: TCP
      port: {{.Values.AgentScalerService.RestPort}}
      targetPort: {{.Values.All.targetPort}}
      name: http
  type: LoadBalancer
  